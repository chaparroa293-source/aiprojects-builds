# Postgres local para desarrollo de Obras.
# Puerto 5433 en el host para no chocar con un Postgres 5432 ya instalado.
services:
  db:
    image: postgres:16
    container_name: obras-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: obras
      POSTGRES_PASSWORD: obras
      POSTGRES_DB: obras
    ports:
      # Sólo loopback: "5433:5432" a secas publica en 0.0.0.0 y deja el
      # Postgres de desarrollo (usuario/clave obras/obras) accesible
      # desde cualquier equipo de la red donde esté la notebook.
      - "127.0.0.1:5433:5432"
    volumes:
      - obras-db-data:/var/lib/postgresql/data

volumes:
  obras-db-data:
